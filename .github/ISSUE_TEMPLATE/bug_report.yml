name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the tool call or CLI command and the error text if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code 2.x / Codex CLI / Claude Desktop / Cursor …
  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: Windows 11, Node 22.9
  - type: markdown
    attributes:
      value: "Please don't attach your journal.db or real account statements. Redact anything personal."

name: Feature request
description: Suggest a tool, stat, import format or dashboard improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe your trading or journaling workflow and where it gets stuck.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
